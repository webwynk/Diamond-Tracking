name: Deploy server functions

# Every merge into main that changes the server functions deploys them to the
# live Supabase project, after their tests pass. Needs the repository secret
# SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens). Database
# migrations are NOT applied here: they are run by hand in the SQL editor.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

# One deploy at a time; a newer merge waits instead of cancelling a deploy
# half way.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bljroionzwxxsgmyituh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Secret is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          fi

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.x

      - name: Test
        working-directory: supabase/functions
        run: |
          deno fmt --check
          deno lint
          deno check */index.ts
          deno test --allow-env

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.2.0 # pinned like the actions (L101)

      # Deploys every function; settings (verify_jwt, import map) come from
      # config.toml. --yes: CI has no terminal to answer the CLI's
      # "Deploy 6 Functions?" question, so without it nothing is deployed.
      - name: Deploy
        run: supabase functions deploy --project-ref "$PROJECT_REF" --yes

      - name: Deployed
        run: supabase functions list --project-ref "$PROJECT_REF"
