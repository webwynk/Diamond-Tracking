name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned so every build uses the same Flutter as development.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Proves the Android project compiles. Uses the placeholder env file:
      # no real keys are needed or available in CI.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=env.example.json
        env:
          # Empty on forks or before the secret is added: the build still works,
          # the map is just blank.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Supabase runs Postgres 17.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migration, security and rules tests
        run: supabase/tests/run_local.sh

  functions:
    name: Server function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check */index.ts
      - run: deno test --allow-env
