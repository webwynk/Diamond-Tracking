name: CI

# Changes that touch only documentation (Markdown files, docs/) skip the
# checks: nothing in them can break the app, the database or the functions.
# A change that mixes docs and code still runs everything.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to an exact commit (L101): a tag like v4 can be moved
# by its owner, a commit cannot. The comment says which release it is.
# To update one, take the new release's commit from its GitHub page.

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # Pinned so every build uses the same Flutter as development.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Proves the Android project compiles. Uses the placeholder env file:
      # no real keys are needed or available in CI.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=env.example.json
        env:
          # Empty on forks or before the secret is added: the build still works,
          # the map is just blank.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

  # L102: the real release build (shrunk by R8, Dart obfuscated), where
  # problems the debug build never shows can appear. Signed with a
  # throwaway key made fresh on every run; the real key is never in CI.
  # The APK is not kept.
  release:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Throwaway signing key
        run: |
          pass="$(openssl rand -hex 16)"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci.jks" \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass "$pass" -keypass "$pass" -dname "CN=CI throwaway"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=ci\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/ci.jks" "$pass" "$pass" > android/key.properties

      - name: Build release APK
        run: |
          # A release refuses to build without a Maps key; the real one is
          # used when the secret is set, otherwise a placeholder (blank map).
          export MAPS_API_KEY="${MAPS_API_KEY:-ci-placeholder}"
          flutter build apk --release --obfuscate --split-debug-info=build/ci-symbols \
            --dart-define-from-file=env.example.json
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Supabase runs Postgres 17.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Migration, security and rules tests
        run: supabase/tests/run_local.sh

  functions:
    name: Server function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check */index.ts
      - run: deno test --allow-env
