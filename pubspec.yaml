name: diamond_tracking
description: "Diamond Agritech employee duty and GPS tracking"
# Private company app. Never published to pub.dev.
publish_to: 'none'

# version is <build-name>+<build-number>.
# On Android, build-name becomes versionName and build-number becomes versionCode.
# versionCode must increase on every Play upload and APK build (Rule 10).
version: 2.0.0+45

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Phase 1 (foundation) adds only what the app shell needs. Each later phase adds
# its own packages (maps, tracking, notifications, PDF), so every pull request
# shows exactly which dependency it brings in and why.
dependencies:
  flutter:
    sdk: flutter

  # Backend: Postgres, Auth, Realtime, Edge Functions.
  supabase_flutter: ^2.18.3

  # State management for the whole app. Plain providers and Notifiers, no code
  # generation, so the build stays simple.
  flutter_riverpod: ^3.5.0

  # Declarative routing. One redirect decides login / user side / admin side.
  go_router: ^18.1.0

  # The signed-in session is kept in the encrypted key store, never in plain
  # preferences.
  flutter_secure_storage: ^11.2.0

  # Date and time formatting in India time (12-hour clock, "20 Nov 2026").
  intl: ^0.20.2

  # Phase 4: duty and tracking.
  # The tracker runs in an Android foreground service (its own Flutter engine)
  # that keeps going with the screen off, and restarts after a phone restart.
  flutter_foreground_task: ^11.0.3
  # GPS fixes inside that service, and the location permission (asked twice:
  # first "while using the app", then "allow all the time", which Android
  # needs to restart tracking after a phone restart).
  geolocator: ^14.1.2
  # Battery level for the 20/15/10% warnings and on every point.
  battery_plus: ^7.1.2
  # Battery warnings as real notifications, from the service. 22.x, because
  # 23.x needs Android compileSdk 37 and a newer Android Gradle plugin.
  flutter_local_notifications: ^22.3.3
  # The app's private folder, for the offline point queue.
  path_provider: ^2.1.6

  # Phase 5: maps. Google's own Flutter plugin (Maps SDK for Android, free for
  # map display). The key is added at build time, see android/app/build.gradle.kts.
  google_maps_flutter: ^2.19.0

  # Phase 6: requests and notifications.
  # Attendance and leave photos from the camera or gallery, shrunk on the
  # phone, then posted straight to Cloudinary with a signed form (http).
  image_picker: ^1.2.4
  http: ^1.6.0
  # Phone push. Firebase is set up in code from env.json (no
  # google-services.json, no Gradle plugin); without those values the app
  # shows notifications inside the app only.
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The two DM Sans files are static cuts (wght 400 and 700, opsz 14) of the
  # variable font below, for the PDF reports only: the PDF library cannot pick a
  # weight from a variable font.
  assets:
    - assets/image/
    - assets/fonts/DMSans-Regular.ttf
    - assets/fonts/DMSans-Bold.ttf

  # DM Sans is BUNDLED, not fetched at runtime, so the first screen is never
  # unstyled on a slow connection. See docs/03-DESIGN-SYSTEM.md.
  #
  # This is a VARIABLE font: one file covers every weight. Google Fonts does not
  # publish static instances for DM Sans. In the theme, select a weight with
  # fontVariations: [FontVariation('wght', 600)] rather than relying on
  # fontWeight alone, because fontWeight snaps to the nearest axis value and is
  # less precise for the 500 and 600 steps this design system uses.
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
