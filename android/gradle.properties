org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled deliberately.
#
# This project lives on D:\ while the Dart pub cache (and therefore every
# plugin's Kotlin source) lives on C:\. Kotlin's incremental compiler cannot
# handle that drive split on Windows and fails every build with
# "Could not close incremental caches" in compileDebugKotlin.
#
# Verified: the failure persisted after `flutter clean` and after stopping the
# Gradle daemon, so it is not stale state.
#
# Cost: slower incremental builds. Correctness over speed.
# Revisit if the project ever moves onto the same drive as the pub cache.
# See CHANGELOG.md 2026-10-13.
kotlin.incremental=false
