ortant;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface text-on-surface flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full relative select-none">
<!-- Top 55% Section: Satellite Imagery Viewport with Geofence Telemetry -->
<div class="relative w-full h-[390px] overflow-hidden bg-slate-900">
<!-- Map Background Imagery Container -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="Photorealistic satellite aerial view of lush green agricultural patchwork farmland in Nashik Maharashtra India. Distinct irregular geometric farm plots, vibrant sugarcane and onion crops, dusty brown earthen rural paths, deep blue agricultural farm pond reflecting sunlight, and scattered terracotta roofs under direct midday sun." data-location="Nashik rural farmland, Maharashtra, India" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAzKevlGfDPuq7iEjeX90vzpu7Zl10Y-WRKkAl6Rw4aeuEPGkxRVUQL9rN6lHK7Qe_omGUXcdy8VGGI2jX_Dwf3-miTR21nvhe9I17OD1l9ZIBDJ0oUkQo3m1KyhnCa_o51uiu6proDp5eY6EkHzh2_x2Har-9de7ifkc1-pxACBYbs9N2HaF-I72U5pu5bNRh_jl1e9qmJM5FSrJxvw7-wqyD2wZ3byGEz00TDCttkEep8Fs9-ZUVE');">
</div>
<!-- Map Subtle Optical Vignette / Contrast Gradients -->
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/30 pointer-events-none"></div>
<!-- Floating Top App Bar (Header card) -->
<div class="absolute top-4 left-4 right-4 z-30">
<div class="h-12 bg-surface-card rounded-xl border border-border-divider px-3 flex items-center justify-between shadow-sm">
<button aria-label="Cancel and close" class="w-9 h-9 flex items-center justify-center text-slate-600 hover:text-text-primary active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<h1 class="font-title-item text-title-item text-text-primary tracking-tight">New place</h1>
<button class="px-3 py-1.5 font-label-medium text-label-medium text-brand-primary active:text-brand-pressed transition-colors" type="button">
          Save
        </button>
</div>
</div>
<!-- Overlapping Geofence Visualization Layer (Adjacent Registered Entity) -->
<div class="absolute -top-10 -right-12 pointer-events-none z-10 flex flex-col items-center">
<div class="w-60 h-60 rounded-full border-2 border-dashed border-slate-400 bg-slate-400/15 flex items-center justify-center relative">
<div class="w-2.5 h-2.5 rounded-full bg-slate-500"></div>
</div>
<!-- Chip tag for adjacent entity -->
<div class="absolute bottom-6 left-2 bg-surface-card/95 backdrop-blur-sm border border-border-divider px-2.5 py-1 rounded-full shadow-sm flex items-center gap-1.5">
<span class="material-symbols-outlined text-slate-500 text-[14px]">storefront</span>
<span class="font-caption-timestamp text-caption-timestamp text-text-secondary font-medium">Patel Agro Dealer — 320 m away</span>
</div>
</div>
<!-- Active Geofence Area: 500m Target Boundary Circle (Centered) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
<!-- 500m Outer Visualized Envelope -->
<div class="w-[280px] h-[280px] rounded-full border-2 border-brand-primary bg-[#016893]/20 flex items-center justify-center relative shadow-[inset_0_0_24px_rgba(1,104,147,0.15)]">
<!-- Range Scale Radians (Utilitarian telemetry marks) -->
<div class="absolute inset-x-0 top-1/2 h-px bg-brand-primary/20 -translate-y-1/2 pointer-events-none"></div>
<div class="absolute inset-y-0 left-1/2 w-px bg-brand-primary/20 -translate-x-1/2 pointer-events-none"></div>
<!-- Metric Indicator Floating Chip -->
<div class="absolute -top-3.5 px-2.5 py-0.5 bg-brand-primary text-white text-[10px] font-semibold tracking-wider uppercase rounded-full shadow-sm">
          500 m Radius
        </div>
<!-- Center Teardrop Location Marker -->
<div class="relative flex flex-col items-center justify-center -translate-y-3">
<!-- Soft Drop Shadow on map surface -->
<div class="absolute -bottom-1 w-4 h-1.5 bg-black/40 rounded-full blur-[1.5px]"></div>
<!-- Custom 40px Brand Pin -->
<div class="relative w-10 h-10 flex items-center justify-center text-brand-primary drop-shadow-md">
<svg class="w-10 h-10 fill-current" viewbox="0 0 24 24">
<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"></path>
</svg>
<!-- Pin Center White Aperture Dot -->
<div class="absolute top-[11px] w-3 h-3 bg-white rounded-full shadow-inner"></div>
</div>
</div>
</div>
</div>
<!-- Floating Map Layer / Satellite Mode Control Button -->
<div class="absolute bottom-6 right-4 z-20">
<button aria-label="Switch map layer view" class="w-10 h-10 bg-surface-card rounded-full border border-border-divider flex items-center justify-center shadow-sm text-text-secondary active:scale-95 transition-transform" id="layer-toggle-btn" type="button">
<span class="material-symbols-outlined text-[20px]">layers</span>
</button>
</div>
</div>
<!-- Lower 45% Section: Configuration Bottom Sheet -->
<div class="relative w-full -mt-5 bg-surface-card rounded-t-[24px] border-t border-border-divider px-4 pt-3 pb-8 shadow-sm flex flex-col gap-4 z-30">
<!-- Center Drag Handle -->
<div class="w-8 h-1 bg-border-input rounded-full mx-auto mb-1"></div>
<!-- Field 1: Place Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-medium text-label-medium text-text-secondary" for="place-name-input">
        Place name
      </label>
<div class="relative h-12 w-full">
<input class="w-full h-12 px-4 rounded-xl border border-border-input bg-surface-card font-body-large text-body-large text-text-primary focus:outline-none focus:border-brand-primary transition-colors" id="place-name-input" type="text" value="Shivpuri Farm"/>
</div>
</div>
<!-- Field 2: Place Type Chips -->
<div class="flex flex-col gap-2">
<span class="font-label-medium text-label-medium text-text-secondary">Type</span>
<div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar -mx-4 px-4">
<!-- Selected: Farm -->
<button class="shrink-0 h-9 px-3.5 rounded-full bg-brand-primary text-white flex items-center gap-1.5 active:bg-brand-pressed transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">psychiatry</span>
<span class="font-label-medium text-label-medium">Farm</span>
</button>
<!-- Unselected: Dealer -->
<button class="shrink-0 h-9 px-3.5 rounded-full bg-surface-card border border-border-input text-text-secondary hover:text-text-primary flex items-center gap-1.5 active:bg-brand-tint transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">storefront</span>
<span class="font-label-medium text-label-medium">Dealer</span>
</button>
<!-- Unselected: Office -->
<button class="shrink-0 h-9 px-3.5 rounded-full bg-surface-card border border-border-input text-text-secondary hover:text-text-primary flex items-center gap-1.5 active:bg-brand-tint transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">corporate_fare</span>
<span class="font-label-medium text-label-medium">Office</span>
</button>
<!-- Unselected: Warehouse -->
<button class="shrink-0 h-9 px-3.5 rounded-full bg-surface-card border border-border-input text-text-secondary hover:text-text-primary flex items-center gap-1.5 active:bg-brand-tint transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">warehouse</span>
<span class="font-label-medium text-label-medium">Warehouse</span>
</button>
<!-- Unselected: Other -->
<button class="shrink-0 h-9 px-3.5 rounded-full bg-surface-card border border-border-input text-text-secondary hover:text-text-primary flex items-center gap-1.5 active:bg-brand-tint transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">location_on</span>
<span class="font-label-medium text-label-medium">Other</span>
</button>
</div>
</div>
<!-- Field 3: Radius Slider Module -->
<div class="flex flex-col gap-2 pt-1">
<div class="flex items-center justify-between">
<label class="font-label-medium text-label-medium text-text-secondary" for="geofence-range-slider">
          Radius
        </label>
<span class="font-label-medium text-[14px] text-brand-primary font-semibold tabular-nums" id="radius-value-display">
          500 m
        </span>
</div>
<!-- Slider Component Structure -->
<div class="relative w-full py-1">
<div class="relative w-full h-1.5 bg-border-divider rounded-full overflow-hidden">
<div class="h-full bg-brand-primary rounded-full" id="slider-progress" style="width: 23%;"></div>
</div>
<!-- Simulated interactive Thumb -->
<div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-brand-primary flex items-center justify-center shadow-md cursor-pointer pointer-events-none" id="slider-thumb" style="left: 23%;">
<div class="w-2 h-2 rounded-full bg-white"></div>
</div>
<!-- Native Invisible Input Range overlay for complete accessibility -->
<input aria-label="Geofence radius" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" id="geofence-range-slider" max="2000" min="50" step="25" type="range" value="500"/>
</div>
<!-- Range Bounds Legend -->
<div class="flex items-center justify-between font-caption-timestamp text-caption-timestamp text-text-disabled">
<span>50 m</span>
<span>2000 m</span>
</div>
</div>
<!-- Notice / Operational Warning Strip -->
<div class="rounded-xl bg-status-info-bg p-3 flex items-start gap-2.5 border border-status-info/20">
<span class="material-symbols-outlined text-status-info text-[20px] shrink-0 mt-0.5">info</span>
<p class="font-body-default text-body-default text-text-primary">
        Employees are asked for a photo when they enter this circle.
      </p>
</div>
<!-- Field 4: Coordinates Readout -->
<div class="flex flex-col gap-1.5">
<label class="font-label-medium text-label-medium text-text-secondary">
        Coordinates
      </label>
<div class="h-12 w-full rounded-xl bg-page-bg border border-border-divider px-3.5 flex items-center justify-between">
<span class="font-body-default text-body-default text-text-secondary tabular-nums font-mono tracking-tight" id="coordinates-text">
          19.99753, 73.78981
        </span>
<button aria-label="Copy coordinates to clipboard" class="w-8 h-8 flex items-center justify-center text-brand-primary active:scale-95 transition-transform rounded-lg hover:bg-brand-tint" id="copy-coords-btn" type="button">
<span class="material-symbols-outlined text-[18px]">content_copy</span>
</button>
</div>
</div>
<!-- Field 5: Active Operational Status Toggle -->
<div class="h-14 flex items-center justify-between border-t border-slate-100 pt-2 mt-1">
<div class="flex flex-col">
<span class="font-body-default text-body-default text-text-primary font-semibold">Active</span>
<span class="font-caption-timestamp text-caption-timestamp text-text-secondary">Raise events when employees arrive</span>
</div>
<!-- Interactive Toggle Control Switch -->
<button aria-checked="true" class="relative w-12 h-7 bg-brand-primary rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-brand-primary/20" id="active-toggle-btn" role="switch" type="button">
<span class="absolute top-[3px] right-[3px] w-[22px] h-[22px] bg-white rounded-full shadow transition-transform" id="active-toggle-knob"></span>
</button>
</div>
</div>
</div>
<script>
  (function() {
    // Dynamic Geofence Radius Slider Sync
    const slider = document.getElementById('geofence-range-slider');
    const display = document.getElementById('radius-value-display');
    const progress = document.getElementById('slider-progress');
    const thumb = document.getElementById('slider-thumb');

    if (slider && display && progress && thumb) {
      slider.addEventListener('input', function(e) {
        const val = parseInt(e.target.value, 10);
        const min = parseInt(slider.min, 10);
        const max = parseInt(slider.max, 10);
        const percentage = ((val - min) / (max - min)) * 100;
        
        display.textContent = val + ' m';
        progress.style.width = percentage + '%';
        thumb.style.left = percentage + '%';
      });
    }

    // Active Toggle Switch Interaction
    const toggleBtn = document.getElementById('active-toggle-btn');
    const toggleKnob = document.getElementById('active-toggle-knob');
    let isActive = true;

    if (toggleBtn && toggleKnob) {
      toggleBtn.addEventListener('click', function() {
        isActive = !isActive;
        toggleBtn.setAttribute('aria-checked', isActive.toString());
        if (isActive) {
          toggleBtn.classList.remove('bg-slate-300');
          toggleBtn.classList.add('bg-brand-primary');
          toggleKnob.classList.remove('right-auto', 'left-[3px]');
          toggleKnob.classList.add('right-[3px]');
        } else {
          toggleBtn.classList.remove('bg-brand-primary');
          toggleBtn.classList.add('bg-slate-300');
          toggleKnob.classList.remove('right-[3px]');
          toggleKnob.classList.add('left-[3px]', 'right-auto');
        }
      });
    }

    // Copy Coordinates Feedback
    const copyBtn = document.getElementById('copy-coords-btn');
    const coordsText = document.getElementById('coordinates-text');
    if (copyBtn && coordsText) {
      copyBtn.addEventListener('click', function() {
        navigator.clipboard?.writeText(coordsText.innerText.trim());
        const originalIcon = copyBtn.innerHTML;
        copyBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] text-status-on-duty">check</span>';
        setTimeout(function() {
          copyBtn.innerHTML = originalIcon;
        }, 1500);
      });
    }
  })();
</script></main></body></html>
