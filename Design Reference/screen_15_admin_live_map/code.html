  document.querySelectorAll('button[type="button"]').forEach(btn => {

      const chip = e.currentTarget;
      if (chip.classList.contains('rounded-full') && chip.textContent.includes('All') || chip.textContent.includes('duty') || chip.textContent.includes('Stale') || chip.textContent.includes('Check') || chip.textContent.includes('Off') || chip.textContent.includes('Blocked')) {

          c.classList.add('bg-white', 'text-slate-700', 'border', 'border-border-input');
        });
        chip.classList.remove('bg-white', 'text-slate-700', 'border', 'border-border-input');
        chip.classList.add('bg-[#016893]', 'text-white');
      }
    });
