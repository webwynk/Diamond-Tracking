<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;font-family:'DM Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "status-info-bg": "#E0F2FE", "on-primary-container": "#fdfcff", "surface-container-high": "#e2e7ff", "brand-tint": "#E8F3F8", "brand-pressed": "#015676", "error": "#ba1a1a", "surface-variant": "#dae2fd", "primary-fixed-dim": "#93ccff", "surface-container-lowest": "#ffffff", "status-stale": "#F59E0B", "primary": "#006194", "surface-bright": "#faf8ff", "status-on-duty": "#16A34A", "secondary": "#00658f", "surface-card": "#FFFFFF", "secondary-fixed": "#c7e7ff", "on-tertiary-fixed": "#002109", "border-input": "#CBD5E1", "secondary-fixed-dim": "#86cfff", "status-info": "#0284C7", "inverse-surface": "#283044", "status-on-duty-bg": "#DCFCE7", "on-error": "#ffffff", "page-bg": "#F8FAFC", "secondary-container": "#86cfff", "surface-container-low": "#f2f3ff", "inverse-on-surface": "#eef0ff", "outline-variant": "#bfc7d2", "outline": "#707881", "error-container": "#ffdad6", "tertiary-fixed-dim": "#62df7d", "on-error-container": "#93000a", "status-suspect-bg": "#FEE2E2", "surface-tint": "#006398", "surface-container-highest": "#dae2fd", "tertiary-container": "#00873a", "on-tertiary-container": "#f7fff2", "on-primary": "#ffffff", "tertiary": "#006b2c", "tertiary-fixed": "#7ffc97", "brand-primary": "#016893", "text-disabled": "#94A3B8", "on-primary-fixed-variant": "#004b73", "brand-chip-bg": "#C5E1EC", "status-stale-bg": "#FEF3C7", "on-primary-fixed": "#001d31", "status-blocked": "#1E293B", "surface": "#faf8ff", "primary-fixed": "#cce5ff", "on-secondary-fixed-variant": "#004c6d", "text-primary": "#0F172A", "inverse-primary": "#93ccff", "on-tertiary-fixed-variant": "#005320", "primary-container": "#007bb9", "background": "#faf8ff", "surface-dim": "#d2d9f4", "status-suspect": "#DC2626", "surface-container": "#eaedff", "border-divider": "#E2E8F0", "on-background": "#131b2e", "on-surface-variant": "#3f4850", "on-secondary-fixed": "#001e2e", "on-secondary": "#ffffff", "status-off-duty": "#94A3B8", "on-tertiary": "#ffffff", "on-secondary-container": "#00587e", "on-surface": "#131b2e", "text-secondary": "#64748B" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "16px", "space-3xs": "8px", "space-touch": "20px", "space-xl": "32px", "space-block": "40px", "space-lg": "24px", "space-section": "48px", "space-xs": "4px", "space-2xs": "4px", "gutter": "16px", "space-sm": "8px", "space-base": "12px", "margin": "16px" }, "fontFamily": { "caption-timestamp": [ "DM Sans" ], "overline-micro": [ "DM Sans" ], "display-stat": [ "DM Sans" ], "body-large": [ "DM Sans" ], "headline-h2": [ "DM Sans" ], "headline-h3": [ "DM Sans" ], "label-medium": [ "DM Sans" ], "title-item": [ "DM Sans" ], "body-default": [ "DM Sans" ] }, "fontSize": { "caption-timestamp": [ "12px", { "lineHeight": "16px", "fontWeight": "400" } ], "overline-micro": [ "11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" } ], "display-stat": [ "32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" } ], "body-large": [ "16px", { "lineHeight": "24px", "fontWeight": "400" } ], "headline-h2": [ "24px", { "lineHeight": "32px", "fontWeight": "600" } ], "headline-h3": [ "20px", { "lineHeight": "28px", "fontWeight": "600" } ], "label-medium": [ "13px", { "lineHeight": "18px", "fontWeight": "500" } ], "title-item": [ "18px", { "lineHeight": "26px", "fontWeight": "600" } ], "body-default": [ "14px", { "lineHeight": "20px", "fontWeight": "400" } ] } } } };</script></head><body class="bg-surface text-on-surface w-full min-h-screen relative flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full relative select-none">
<!-- Map Scrim Context (Top 15% glimpse) -->
<div class="relative w-full h-24 overflow-hidden bg-surface-container">
<div class="w-full h-full bg-cover bg-center filter grayscale opacity-60" data-location="Shivpuri, Maharashtra, India" style=""></div>
<!-- Scrim overlay -->
<div class="absolute inset-0 bg-[#0F172A]/40 flex items-center justify-between px-4 pb-4">
<div class="flex items-center gap-1.5 px-2.5 py-1 bg-[#0F172A]/70 rounded-full backdrop-blur-xs">
<span class="w-2 h-2 rounded-full bg-status-on-duty animate-pulse"></span>
<span class="font-overline-micro text-overline-micro text-white tracking-wider">LIVE GPS ACTIVE</span>
</div>
<span class="material-symbols-outlined text-white text-xl opacity-80">my_location</span>
</div>
</div>
<!-- Bottom Sheet Modal Content Container -->
<div class="relative -mt-6 w-full bg-surface-card rounded-t-3xl border-t border-border-divider shadow-xl flex flex-col px-4 pt-3 pb-6">
<!-- Sheet Drag Handle -->
<div class="flex justify-center w-full mb-3">
<div class="w-8 h-1 bg-[#CBD5E1] rounded-full"></div>
</div>
<!-- Header Row -->
<div class="flex items-center justify-between w-full mb-4">
<h2 class="font-headline-h3 text-headline-h3 text-text-primary">Add visit</h2>
<button aria-label="Close" class="w-10 h-10 rounded-full bg-[#F1F5F9] text-[#475569] flex items-center justify-center hover:bg-slate-200 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Geofence Arrival Strip -->
<div class="w-full bg-[#E8F3F8] rounded-xl p-3 flex items-start gap-3 mb-5 border border-brand-chip-bg/40">
<div class="mt-0.5 text-brand-primary flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-body-default text-body-default font-semibold text-text-primary leading-tight">Shivpuri Farm</span>
<span class="font-caption-timestamp text-caption-timestamp text-text-secondary mt-0.5">You arrived at 2:14 PM · within 500 m</span>
</div>
</div>
<!-- Photo Section -->
<div class="w-full flex flex-col mb-4">
<div class="flex items-center justify-between mb-1.5">
<span class="font-overline-micro text-overline-micro text-text-secondary uppercase tracking-[0.05em]">PHOTO</span>
<span class="font-caption-timestamp text-caption-timestamp text-status-info flex items-center gap-1 font-medium">
<span class="material-symbols-outlined text-[14px]">verified</span>
          Verified In-situ
        </span>
</div>
<!-- 200px Tall Photo Container -->
<div class="relative w-full h-[200px] rounded-xl overflow-hidden border border-border-divider bg-surface-container">
<img alt="Lush green crop rows at Shivpuri farm Maharashtra under natural daylight" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBInVqMEL7NAV2G6amxbX0b7smh3_EDDnhnRv-CT1SBROmf1rINtDNM_Y4otRsO0_DvExqIIP5nXxWfR8C9QSy66uoNLkVQykSJ8-aJSwTCqZ_VobWEazpCR2BmcyKOcNRnPJHOqzHVg8SHikUzr-4DUr0UEpsiuLCa8AJqUZVjNu-_Pd2RWGvyvp8GUvXrjQWOJFFJ4RWpZgKaRrINd57kvqipqlmdecrlQCMBJMI3GPeb8tFfWOwk"/>
<!-- Retake Camera Button (Top-Right) -->
<button aria-label="Retake photo" class="absolute top-3 right-3 w-9 h-9 rounded-full bg-surface-card border border-black/10 shadow-sm flex items-center justify-center text-[#475569] hover:bg-slate-50 active:rotate-180 transition-all duration-300" id="retake-btn" type="button">
<span class="material-symbols-outlined text-[20px]">flip_camera_ios</span>
</button>
<!-- Geotag Chip Overlay (Bottom-Left) -->
<div class="absolute bottom-3 left-3 bg-[#0F172A]/70 backdrop-blur-xs rounded-lg px-2.5 py-2 flex flex-col text-white max-w-[85%] shadow-sm pointer-events-none">
<div class="flex items-center gap-1 text-[11px] font-caption-timestamp leading-tight text-white/90">
<span class="material-symbols-outlined text-[13px] text-primary-fixed-dim">schedule</span>
<span>12 Oct 2026, 2:15 PM</span>
</div>
<div class="flex items-center gap-1 font-caption-timestamp text-caption-timestamp text-white font-mono tracking-tight mt-0.5">
<span class="material-symbols-outlined text-[13px] text-tertiary-fixed">satellite_alt</span>
<span>19.9975° N, 73.7898° E</span>
</div>
</div>
</div>
</div>
<!-- Note Section -->
<div class="w-full flex flex-col mb-5">
<label class="font-overline-micro text-overline-micro text-text-secondary uppercase tracking-[0.05em] mb-1.5" for="visit-notes">NOTE (OPTIONAL)</label>
<div class="relative w-full h-24 rounded-xl border border-border-input bg-surface-card p-3 focus-within:border-brand-primary transition-colors">
<textarea class="w-full h-14 bg-transparent resize-none border-none outline-none font-body-large text-body-large text-text-primary p-0 leading-snug placeholder:text-text-disabled" id="visit-notes" maxlength="200" placeholder="Add observation details...">Met owner, discussed kharif seed order.</textarea>
<span class="absolute bottom-2 right-3 font-caption-timestamp text-caption-timestamp text-text-disabled tabular-nums" id="char-counter">42/200</span>
</div>
</div>
<!-- Actions Section -->
<div class="w-full flex flex-col gap-2 mt-auto">
<button class="w-full h-12 rounded-xl bg-brand-primary active:bg-brand-pressed text-white font-label-medium text-label-medium flex items-center justify-center gap-2 transition-colors" id="save-visit-btn" type="button">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
<span>Save visit</span>
</button>
<button class="w-full h-12 rounded-xl bg-transparent hover:bg-slate-50 text-text-secondary font-label-medium text-label-medium flex items-center justify-center transition-colors" type="button">
        Skip photo
      </button>
</div>
</div>
</div>
<script>
  (function() {
    const textarea = document.getElementById('visit-notes');
    const counter = document.getElementById('char-counter');
    const saveBtn = document.getElementById('save-visit-btn');
    const retakeBtn = document.getElementById('retake-btn');

    if (textarea && counter) {
      textarea.addEventListener('input', () => {
        counter.textContent = `${textarea.value.length}/200`;
      });
    }

    if (retakeBtn) {
      retakeBtn.addEventListener('click', () => {
        retakeBtn.classList.add('scale-90');
        setTimeout(() => retakeBtn.classList.remove('scale-90'), 150);
      });
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        const originalText = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Syncing...</span>';
        setTimeout(() => {
          saveBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">task_alt</span><span>Saved</span>';
          setTimeout(() => {
            saveBtn.innerHTML = originalText;
          }, 1200);
        }, 600);
      });
    }
  })();
</script></main></body></html>
