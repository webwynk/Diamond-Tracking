"#FEF3C7", "status-off-duty": "#94A3B8", "on-primary-container": "#fdfcff", "on-surface": "#131b2e", "on-tertiary": "#ffffff", "status-stale": "#F59E0B", "surface-container-low": "#f2f3ff", "text-primary": "#0F172A", "on-secondary-fixed": "#001e2e", "secondary-fixed-dim": "#86cfff", "primary-container": "#007bb9" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-section": "48px", "space-block": "40px", "space-lg": "24px", "space-base": "12px", "space-xl": "32px", "space-md": "16px", "space-xs": "4px", "space-3xs": "8px", "space-2xs": "4px", "space-sm": "8px", "space-touch": "20px", "gutter": "16px", "margin": "16px" }, "fontFamily": { "caption-timestamp": ["DM Sans"], "body-large": ["DM Sans"], "overline-micro": ["DM Sans"], "body-default": ["DM Sans"], "headline-h2": ["DM Sans"], "label-medium": ["DM Sans"], "display-stat": ["DM Sans"], "headline-h3": ["DM Sans"], "title-item": ["DM Sans"] }, "fontSize": { "caption-timestamp": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-large": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "overline-micro": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }], "body-default": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-h2": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "label-medium": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "display-stat": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "title-item": ["18px", { "lineHeight": "26px", "fontWeight": "600" }] } } } };</script><style>@layer base { html, body { width: 100vw; margin: 0; padding: 0; min-height: 100%; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-on-background/50 text-on-surface font-body-default min-h-screen relative flex flex-col items-center justify-end antialiased"><main class="relative w-full flex-1 flex flex-col justify-end pt-safe pb-safe"><div class="flex flex-col w-full relative">
<!-- Dimmed Background App Content (Top ~25% visible beneath modal scrim) -->
<div class="relative w-full px-space-md pt-2 pb-space-lg select-none pointer-events-none opacity-40">
<!-- Header simulation -->
<div class="flex items-center justify-between pb-space-base">
<div class="flex items-center gap-space-sm">
<span class="material-symbols-outlined text-text-primary text-[24px]">arrow_back</span>
<span class="font-headline-h3 text-headline-h3 text-text-primary">Agritech Operations</span>
</div>
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-text-secondary text-[22px]">notifications</span>
</div>
</div>
<!-- Search Bar simulation -->
<div class="w-full h-[44px] bg-surface-card rounded-lg flex items-center px-space-base gap-space-sm border border-border-input">
<span class="material-symbols-outlined text-text-secondary text-[20px]">search</span>
<span class="font-body-default text-body-default text-text-disabled">Search 152 field officers...</span>
</div>
</div>
<!-- Modal Scrim Overlay -->
<div class="absolute inset-0 bg-[#0F172A]/40 backdrop-blur-[0.5px] z-10 pointer-events-auto"></div>
<!-- Filter Bottom Sheet Container -->
<div class="relative z-20 w-full bg-surface-card rounded-t-3xl shadow-xl flex flex-col overflow-hidden max-h-[85vh]">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-3 shrink-0">
<div class="w-8 h-1 bg-border-input rounded-full"></div>
</div>
<!-- Header Row -->
<div class="px-space-md pb-space-base flex items-center justify-between shrink-0">
<h2 class="font-headline-h3 text-headline-h3 text-text-primary">Filters</h2>
<button class="font-label-medium text-label-medium text-brand-primary active:text-brand-pressed p-1 transition-colors" id="clearAllBtn" type="button">
        Clear all
      </button>
</div>
<!-- Divider -->
<div class="w-full h-px bg-border-divider shrink-0"></div>
<!-- Scrollable Content Body -->
<div class="overflow-y-auto px-space-md py-space-md flex flex-col gap-space-lg overscroll-contain pb-space-block">
<!-- Section 1: STATUS -->
<section class="flex flex-col gap-space-sm">
<span class="font-overline-micro text-overline-micro text-text-secondary uppercase">STATUS</span>
<div class="flex flex-wrap gap-space-sm">
<!-- Chip 1: Selected -->
<button class="filter-chip h-9 px-3 rounded-full flex items-center gap-1.5 bg-brand-tint border-2 border-brand-primary text-brand-primary font-label-medium text-label-medium cursor-pointer transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-status-on-duty"></span>
<span>On duty 112</span>
<span class="material-symbols-outlined text-[16px] text-brand-primary leading-none">check</span>
</button>
<!-- Chip 2: Selected -->
<button class="filter-chip h-9 px-3 rounded-full flex items-center gap-1.5 bg-brand-tint border-2 border-brand-primary text-brand-primary font-label-medium text-label-medium cursor-pointer transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-status-stale"></span>
<span>Check needed 3</span>
<span class="material-symbols-outlined text-[16px] text-brand-primary leading-none">check</span>
</button>
<!-- Chip 3: Unselected -->
<button class="filter-chip h-9 px-3 rounded-full flex items-center gap-1.5 bg-surface-card border border-border-input text-text-secondary font-label-medium text-label-medium cursor-pointer transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-status-off-duty"></span>
<span>Off duty 31</span>
</button>
<!-- Chip 4: Unselected -->
<button class="filter-chip h-9 px-3 rounded-full flex items-center gap-1.5 bg-surface-card border border-border-input text-text-secondary font-label-medium text-label-medium cursor-pointer transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-status-stale"></span>
<span>Stale 4</span>
</button>
<!-- Chip 5: Unselected -->
<button class="filter-chip h-9 px-3 rounded-full flex items-center gap-1.5 bg-surface-card border border-border-input text-text-secondary font-label-medium text-label-medium cursor-pointer transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-status-suspect"></span>
<span>Blocked 2</span>
</button>
</div>
</section>
<!-- Section 2: DUTY TODAY -->
<section class="flex flex-col gap-space-sm">
<span class="font-overline-micro text-overline-micro text-text-secondary uppercase">DUTY TODAY</span>
<div class="flex flex-wrap gap-space-sm">
<!-- Worked today: Selected -->
<button class="duty-chip h-9 px-3 rounded-full flex items-center gap-1.5 bg-brand-tint border-2 border-brand-primary text-brand-primary font-label-medium text-label-medium cursor-pointer transition-all" type="button">
<span>Worked today</span>
<span class="material-symbols-outlined text-[16px] text-brand-primary leading-none">check</span>
</button>
<!-- Not started: Unselected -->
<button class="duty-chip h-9 px-3 rounded-full flex items-center gap-1.5 bg-surface-card border border-border-input text-text-secondary font-label-medium text-label-medium cursor-pointer transition-all" type="button">
<span>Not started</span>
</button>
<!-- Auto-ended: Unselected -->
<button class="duty-chip h-9 px-3 rounded-full flex items-center gap-1.5 bg-surface-card border border-border-input text-text-secondary font-label-medium text-label-medium cursor-pointer transition-all" type="button">
<span>Auto-ended</span>
</button>
</div>
</section>
<!-- Section 3: DATE RANGE -->
<section class="flex flex-col gap-space-sm">
<span class="font-overline-micro text-overline-micro text-text-secondary uppercase">DATE RANGE</span>
<!-- 4 Quick Date Filter Chips -->
<div class="flex items-center gap-space-sm overflow-x-hidden">
<button class="date-chip h-8 px-3 rounded-full bg-brand-primary text-on-primary font-label-medium text-label-medium transition-colors" type="button">
            Today
          </button>
<button class="date-chip h-8 px-3 rounded-full bg-surface-card border border-border-input text-text-secondary font-label-medium text-label-medium transition-colors" type="button">
            Yesterday
          </button>
<button class="date-chip h-8 px-3 rounded-full bg-surface-card border border-border-input text-text-secondary font-label-medium text-label-medium transition-colors" type="button">
            Last 7 days
          </button>
<button class="date-chip h-8 px-3 rounded-full bg-surface-card border border-border-input text-text-secondary font-label-medium text-label-medium transition-colors" type="button">
            This month
          </button>
</div>
<!-- Read-only Date Input Field -->
<div class="h-12 w-full rounded-xl bg-page-bg border border-border-input flex items-center px-space-md gap-space-base cursor-default select-none mt-1">
<span class="material-symbols-outlined text-text-secondary text-[20px] leading-none">calendar_today</span>
<span class="font-body-default text-body-default text-text-primary font-medium tracking-normal">12 Oct 2026</span>
</div>
</section>
<!-- Section 4: SORT BY -->
<section class="flex flex-col gap-1">
<span class="font-overline-micro text-overline-micro text-text-secondary uppercase mb-1">SORT BY</span>
<!-- Radio Option 1: Selected -->
<label class="sort-option w-full h-12 flex items-center justify-between border-b border-[#F1F5F9] cursor-pointer">
<div class="flex items-center gap-3">
<span class="radio-indicator relative w-5 h-5 rounded-full border-2 border-brand-primary flex items-center justify-center">
<span class="w-2.5 h-2.5 rounded-full bg-brand-primary"></span>
</span>
<span class="font-body-default text-body-default text-text-primary">Name (A–Z)</span>
</div>
<input checked="" class="hidden" name="sort_option" type="radio" value="name"/>
</label>
<!-- Radio Option 2: Unselected -->
<label class="sort-option w-full h-12 flex items-center justify-between border-b border-[#F1F5F9] cursor-pointer">
<div class="flex items-center gap-3">
<span class="radio-indicator relative w-5 h-5 rounded-full border-[1.5px] border-border-input flex items-center justify-center">
<span class="w-2.5 h-2.5 rounded-full bg-transparent"></span>
</span>
<span class="font-body-default text-body-default text-text-primary">Employee ID</span>
</div>
<input class="hidden" name="sort_option" type="radio" value="id"/>
</label>
<!-- Radio Option 3: Unselected -->
<label class="sort-option w-full h-12 flex items-center justify-between border-b border-[#F1F5F9] cursor-pointer">
<div class="flex items-center gap-3">
<span class="radio-indicator relative w-5 h-5 rounded-full border-[1.5px] border-border-input flex items-center justify-center">
<span class="w-2.5 h-2.5 rounded-full bg-transparent"></span>
</span>
<span class="font-body-default text-body-default text-text-primary">Last active</span>
</div>
<input class="hidden" name="sort_option" type="radio" value="active"/>
</label>
<!-- Radio Option 4: Unselected -->
<label class="sort-option w-full h-12 flex items-center justify-between cursor-pointer">
<div class="flex items-center gap-3">
<span class="radio-indicator relative w-5 h-5 rounded-full border-[1.5px] border-border-input flex items-center justify-center">
<span class="w-2.5 h-2.5 rounded-full bg-transparent"></span>
</span>
<span class="font-body-default text-body-default text-text-primary">Distance today</span>
</div>
<input class="hidden" name="sort_option" type="radio" value="distance"/>
</label>
</section>
</div>
<!-- Pinned Bottom Bar -->
<div class="w-full bg-surface-card border-t border-border-divider p-space-md pb-6 shrink-0 z-30">
<div class="flex items-center gap-3 w-full">
<!-- Reset Button -->
<button class="flex-1 h-12 rounded-xl border border-border-input bg-transparent hover:bg-page-bg active:bg-border-divider/50 flex items-center justify-center font-label-medium text-label-medium text-[#475569] transition-colors" id="resetBtn" type="button">
          Reset
        </button>
<!-- Show Results Button -->
<button class="flex-1 h-12 rounded-xl bg-brand-primary hover:bg-brand-pressed active:bg-brand-pressed flex items-center justify-center font-label-medium text-label-medium text-on-primary transition-colors" id="applyBtn" type="button">
          Show 115 results
        </button>
</div>
</div>
</div>
</div>
<script>
  // Interactive Sort Selector
  document.querySelectorAll('.sort-option').forEach(option => {
    option.addEventListener('click', () => {
      document.querySelectorAll('.sort-option').forEach(opt => {
        const ind = opt.querySelector('.radio-indicator');
        ind.className = 'radio-indicator relative w-5 h-5 rounded-full border-[1.5px] border-border-input flex items-center justify-center';
        ind.children[0].className = 'w-2.5 h-2.5 rounded-full bg-transparent';
      });
      const activeInd = option.querySelector('.radio-indicator');
      activeInd.className = 'radio-indicator relative w-5 h-5 rounded-full border-2 border-brand-primary flex items-center justify-center';
      activeInd.children[0].className = 'w-2.5 h-2.5 rounded-full bg-brand-primary';
    });
  });

  // Date Chip Selector
  document.querySelectorAll('.date-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.date-chip').forEach(c => {
        c.className = 'date-chip h-8 px-3 rounded-full bg-surface-card border border-border-input text-text-secondary font-label-medium text-label-medium transition-colors';
      });
      chip.className = 'date-chip h-8 px-3 rounded-full bg-brand-primary text-on-primary font-label-medium text-label-medium transition-colors';
    });
  });

  // Reset Interaction Feedback
  document.getElementById('resetBtn').addEventListener('click', () => {
    const btn = document.getElementById('applyBtn');
    btn.textContent = 'Show 152 results';
  });
</script></main>
</body></html>
