<div class="w-12 h-14 rounded-xl bg-surface-card border border-border-input flex items-center justify-center"></div>
<div class="w-12 h-14 rounded-xl bg-surface-card border border-border-input flex items-center justify-center"></div>
<div class="w-12 h-14 rounded-xl bg-surface-card border border-border-input flex items-center justify-center"></div>
<div class="w-12 h-14 rounded-xl bg-surface-card border border-border-input flex items-center justify-center"></div>
<div class="w-12 h-14 rounded-xl bg-surface-card border border-border-input flex items-center justify-center"></div>
</div>
</div>

<!-- Rule 2: Satisfied -->
<div class="flex items-center gap-space-3xs">
<span class="material-symbols-outlined text-status-on-duty text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-caption-timestamp text-caption-timestamp text-status-on-duty font-medium">Not the same digit repeated</span>

</div>
</div>
