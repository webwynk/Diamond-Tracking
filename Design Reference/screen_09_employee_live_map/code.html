<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

 "#16A34A", "border-divider": "#E2E8F0", "on-secondary-fixed": "#001e2e", "secondary-container": "#86cfff", "on-tertiary": "#ffffff", "status-info-bg": "#E0F2FE", "on-tertiary-container": "#f7fff2", "surface-container": "#eaedff", "brand-primary": "#016893", "on-surface": "#131b2e", "tertiary": "#006b2c", "inverse-on-surface": "#eef0ff", "on-primary-container": "#fdfcff", "error": "#ba1a1a", "text-secondary": "#64748B", "surface": "#faf8ff", "status-suspect-bg": "#FEE2E2", "tertiary-fixed": "#7ffc97", "surface-container-high": "#e2e7ff", "status-on-duty-bg": "#DCFCE7", "surface-container-low": "#f2f3ff", "surface-bright": "#faf8ff", "surface-card": "#FFFFFF", "status-stale": "#F59E0B" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-touch": "20px", "space-section": "48px", "space-2xs": "4px", "margin": "16px", "space-lg": "24px", "space-block": "40px", "space-xs": "4px", "space-3xs": "8px", "space-xl": "32px", "space-md": "16px", "space-base": "12px", "space-sm": "8px", "gutter": "16px" }, "fontFamily": { "caption-timestamp": ["DM Sans"], "body-large": ["DM Sans"], "label-medium": ["DM Sans"], "overline-micro": ["DM Sans"], "headline-h2": ["DM Sans"], "body-default": ["DM Sans"], "headline-h3": ["DM Sans"], "title-item": ["DM Sans"], "display-stat": ["DM Sans"] }, "fontSize": { "caption-timestamp": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-large": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-medium": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "overline-micro": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }], "headline-h2": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "body-default": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "title-item": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "display-stat": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface font-body-default text-body-default text-on-surface w-full min-h-screen relative overflow-x-hidden"><main class="relative w-full min-h-screen bg-surface"><div class="flex flex-col w-full relative select-none overflow-hidden" style="height: 844px; max-width: 390px; margin: 0 auto;">
<!-- FULL BLEED CARTOGRAPHIC VECTOR CANVAS -->
<div class="absolute inset-0 w-full h-full bg-[#F1F5F9] z-0 overflow-hidden">
<svg class="w-full h-full object-cover" fill="none" preserveaspectratio="xMidYMid slice" viewbox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
<!-- Land Parcells / Background Fields -->
<rect fill="#F1F5F9" height="844" width="390"></rect>
<!-- Subtle Agricultural Zones -->
<path d="M-20 40 L160 10 L140 180 L-10 160 Z" fill="#EAEFF5" opacity="0.6"></path>
<path d="M220 220 L410 190 L420 380 L230 360 Z" fill="#EAEFF5" opacity="0.7"></path>
<path d="M-10 420 L150 400 L120 620 L-20 600 Z" fill="#EBF3F0" opacity="0.5"></path>
<path d="M210 560 L400 520 L410 740 L190 710 Z" fill="#EAEFF5" opacity="0.6"></path>
<!-- Water feature: Darna River & Canals -->
<path d="M-30 290 C 70 280, 110 330, 200 325 C 280 320, 310 270, 420 280" fill="none" stroke="#C5E1EC" stroke-linecap="round" stroke-width="26"></path>
<path d="M-30 290 C 70 280, 110 330, 200 325 C 280 320, 310 270, 420 280" fill="none" stroke="#B1D7E7" stroke-linecap="round" stroke-width="6"></path>
<!-- Minor Water Feeder Canal -->
<path d="M190 328 C 175 420, 195 470, 160 550" fill="none" stroke="#C5E1EC" stroke-dasharray="6 3" stroke-linecap="round" stroke-width="5"></path>
<!-- Secondary Road Grid (White with hairline borders) -->
<!-- Road Outer Casings -->
<path d="M-10 130 L400 130" stroke="#E2E8F0" stroke-linecap="square" stroke-width="10"></path>
<path d="M70 -10 L70 860" stroke="#E2E8F0" stroke-linecap="square" stroke-width="8"></path>
<path d="M310 -10 L310 860" stroke="#E2E8F0" stroke-linecap="square" stroke-width="7"></path>
<path d="M-20 540 L410 470" stroke="#E2E8F0" stroke-linecap="square" stroke-width="8"></path>
<path d="M140 680 L410 680" stroke="#E2E8F0" stroke-linecap="square" stroke-width="7"></path>
<!-- Road Fills (Crisp Pure White) -->
<path d="M-10 130 L400 130" stroke="#FFFFFF" stroke-linecap="square" stroke-width="7"></path>
<path d="M70 -10 L70 860" stroke="#FFFFFF" stroke-linecap="square" stroke-width="5"></path>
<path d="M310 -10 L310 860" stroke="#FFFFFF" stroke-linecap="square" stroke-width="4"></path>
<path d="M-20 540 L410 470" stroke="#FFFFFF" stroke-linecap="square" stroke-width="5"></path>
<path d="M140 680 L410 680" stroke="#FFFFFF" stroke-linecap="square" stroke-width="4"></path>
<!-- Primary Arterial Highway (Sinnar-Nashik NH-160 Trunk Corridor) -->
<path d="M 52 750 C 65 670, 85 620, 130 570 C 180 515, 230 490, 245 425 C 260 360, 205 315, 175 260 C 145 205, 165 140, 215 90 C 240 65, 265 40, 290 -10" fill="none" id="highway_trunk" stroke="#E2E8F0" stroke-linecap="round" stroke-width="14"></path>
<path d="M 52 750 C 65 670, 85 620, 130 570 C 180 515, 230 490, 245 425 C 260 360, 205 315, 175 260 C 145 205, 165 140, 215 90 C 240 65, 265 40, 290 -10" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="10"></path>
<!-- Cartographic Geographic Typographic Labels -->
<text fill="#64748B" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" letter-spacing="0.08em" x="215" y="305">DARNA RIVER</text>
<text fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="0.05em" x="14" y="122">SINNAR BYPASS RD</text>
<text fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="0.05em" x="78" y="40">DEOLALI EXT</text>
<text fill="#64748B" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="0.04em" x="248" y="150">NH-160</text>
<text fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" x="160" y="700">SH-28 JUNCTION</text>
<!-- ACTIVE GPS ROUTE TRAIL (6 Gentle Bends, High Visibility Green) -->
<!-- Outer glow for high daylight contrast -->
<path d="M 62 675 C 80 640, 95 605, 135 565 C 180 520, 235 488, 245 420 C 255 365, 205 320, 178 268 C 160 230, 168 185, 202 142 L 210 130" fill="none" opacity="0.9" stroke="#DCFCE7" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"></path>
<!-- Core Route Path #16A34A (4px stroke width) -->
<path d="M 62 675 C 80 640, 95 605, 135 565 C 180 520, 235 488, 245 420 C 255 365, 205 320, 178 268 C 160 230, 168 185, 202 142 L 210 130" fill="none" id="active_telemetry_route" stroke="#16A34A" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
<!-- START MARKER (Origin point at Sinnar Station) -->
<g transform="translate(62, 675)">
<circle cx="0" cy="0" fill="#FFFFFF" r="10" stroke="#94A3B8" stroke-width="1.5"></circle>
<!-- Origin Flag -->
<path d="M-3 4 L-3 -4 L3 -2 L-3 0" fill="#94A3B8"></path>
<line stroke="#94A3B8" stroke-linecap="round" stroke-width="1.5" x1="-3" x2="-3" y1="-4" y2="5"></line>
</g>
<!-- INTERMEDIATE VISIT MARKER 1: Farm Cluster A (Lat 19.854) -->
<g transform="translate(142, 558)">
<ellipse cx="0" cy="5" fill="#0F172A" opacity="0.2" rx="5" ry="2.5"></ellipse>
<path d="M0 -15 C-5.5 -15 -10 -10.5 -10 -5 C-10 2.5 0 9 0 9 C0 9 10 2.5 10 -5 C10 -10.5 5.5 -15 0 -15 Z" fill="#016893" stroke="#FFFFFF" stroke-width="1.5"></path>
<circle cx="0" cy="-6" fill="#FFFFFF" r="3"></circle>
</g>
<!-- INTERMEDIATE VISIT MARKER 2: Darna Valley Plot 4B -->
<g transform="translate(244, 420)">
<ellipse cx="0" cy="5" fill="#0F172A" opacity="0.2" rx="5" ry="2.5"></ellipse>
<path d="M0 -15 C-5.5 -15 -10 -10.5 -10 -5 C-10 2.5 0 9 0 9 C0 9 10 2.5 10 -5 C10 -10.5 5.5 -15 0 -15 Z" fill="#016893" stroke="#FFFFFF" stroke-width="1.5"></path>
<circle cx="0" cy="-6" fill="#FFFFFF" r="3"></circle>
</g>
<!-- INTERMEDIATE VISIT MARKER 3: Krishi Vigyan Kendra Nursery -->
<g transform="translate(178, 268)">
<ellipse cx="0" cy="5" fill="#0F172A" opacity="0.2" rx="5" ry="2.5"></ellipse>
<path d="M0 -15 C-5.5 -15 -10 -10.5 -10 -5 C-10 2.5 0 9 0 9 C0 9 10 2.5 10 -5 C10 -10.5 5.5 -15 0 -15 Z" fill="#016893" stroke="#FFFFFF" stroke-width="1.5"></path>
<circle cx="0" cy="-6" fill="#FFFFFF" r="3"></circle>
</g>
<!-- CURRENT LIVE LOCATION MARKER: Ramesh Kumar (36px Marker with Radar Pulse) -->
<g transform="translate(210, 130)">
<!-- Radar Pulse Circle Waves (CSS animated inline) -->
<circle cx="0" cy="0" fill="#16A34A" opacity="0.25" r="18">
<animate attributename="r" dur="2s" repeatcount="indefinite" values="16;38"></animate>
<animate attributename="opacity" dur="2s" repeatcount="indefinite" values="0.45;0"></animate>
</circle>
<circle cx="0" cy="0" fill="#16A34A" opacity="0.15" r="18">
<animate attributename="r" begin="0.5s" dur="2s" repeatcount="indefinite" values="16;28"></animate>
<animate attributename="opacity" begin="0.5s" dur="2s" repeatcount="indefinite" values="0.35;0"></animate>
</circle>
<!-- Drop Shadow Pin Halo -->
<circle cx="0" cy="2" fill="#0F172A" opacity="0.12" r="18"></circle>
<!-- Primary 36px circular marker with crisp white border (3px) -->
<circle cx="0" cy="0" fill="#16A34A" r="18" stroke="#FFFFFF" stroke-width="3"></circle>
<!-- Solid White Center Dot -->
<circle cx="0" cy="0" fill="#FFFFFF" r="6"></circle>
</g>
</svg>
</div>
<!-- FLOATING APP BAR OVERLAY (Top Inset 16px, 48px height, 12px Radius) -->
<header class="relative z-20 mx-4 mt-4 h-12 bg-white rounded-xl border border-border-divider shadow-sm flex items-center justify-between px-3">
<!-- Back Button -->
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center text-brand-primary active:bg-brand-tint rounded transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- App Bar Title -->
<h1 class="font-title-item text-title-item text-text-primary tracking-tight">My location</h1>
<!-- Duty Status Badge with Pulsing Live Indicator -->
<div class="bg-status-on-duty-bg px-2.5 py-1 rounded-full flex items-center gap-1.5 border border-status-on-duty/20">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-status-on-duty opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-status-on-duty"></span>
</span>
<span class="font-label-medium text-label-medium text-status-on-duty font-semibold">On duty</span>
</div>
</header>
<!-- LIVE TELEMETRY FLOATING TOAST CHIP (Field Quality Assurance) -->
<div class="relative z-10 mx-auto mt-2.5 bg-white/95 backdrop-blur-sm px-3 py-1 rounded border border-border-divider flex items-center gap-2 shadow-xs">
<span class="material-symbols-outlined text-brand-primary text-[15px]">satellite_alt</span>
<span class="font-caption-timestamp text-caption-timestamp text-text-secondary">GPS Lock: High (3.2m) • Sinnar Sector</span>
</div>
<!-- SPACER TO PUSH CONTROLS & BOTTOM SHEET DOWN -->
<div class="flex-grow min-h-0"></div>
<!-- MID-SCREEN FLOATING MAP CONTROLS & ATTRIBUTION ROW -->
<div class="relative z-20 px-4 mb-3 flex items-end justify-between pointer-events-none">
<!-- Mapbox / OSM Attribution -->
<div class="pointer-events-auto bg-white/80 backdrop-blur-xs px-2 py-0.5 rounded border border-border-divider/50 shadow-xs">
<span class="font-caption-timestamp text-[10px] text-text-secondary leading-none">© Mapbox © OpenStreetMap</span>
</div>
<!-- Right Stacked Control Actions -->
<div class="flex flex-col gap-2 pointer-events-auto">
<!-- Crosshair / Re-center GPS Button -->
<button aria-label="Recenter map" class="w-12 h-12 bg-white rounded-full border border-border-divider shadow-sm flex items-center justify-center text-brand-primary active:bg-brand-tint transition-all focus:outline-none" id="recenterBtn" type="button">
<span class="material-symbols-outlined text-[24px]">my_location</span>
</button>
<!-- Layer / Map View Mode Button -->
<button aria-label="Change map layer" class="w-12 h-12 bg-white rounded-full border border-border-divider shadow-sm flex items-center justify-center text-text-secondary active:bg-page-bg transition-all focus:outline-none" id="layersBtn" type="button">
<span class="material-symbols-outlined text-[24px]">layers</span>
</button>
</div>
</div>
<!-- BOTTOM SHEET (Pinned to screen bottom, 24px top radius, 3-column stats + CTA) -->
<section class="relative z-30 w-full bg-white rounded-t-[24px] border-t border-border-divider shadow-[0_-4px_20px_rgba(0,0,0,0.06)] px-4 pt-2.5 pb-6">
<!-- Centered Drag Handle (32x4px) -->
<div class="flex justify-center w-full mb-3">
<div class="w-8 h-1 bg-[#CBD5E1] rounded-full"></div>
</div>
<!-- Section Overline Category -->
<div class="mb-3 px-1">
<span class="font-overline-micro text-overline-micro text-text-secondary uppercase font-semibold tracking-wider">TODAY</span>
</div>
<!-- 3-Column Telemetry Stat Block -->
<div class="w-full bg-page-bg border border-border-divider rounded-lg grid grid-cols-3 divide-x divide-border-divider py-3 mb-4">
<!-- Col 1: Shift Duration -->
<div class="flex flex-col items-center justify-center text-center px-1">
<span class="font-headline-h2 text-[26px] leading-8 font-bold text-text-primary tracking-tight font-display-stat tabular-nums">7h 24m</span>
<span class="font-caption-timestamp text-caption-timestamp text-text-secondary mt-0.5">Hours</span>
</div>
<!-- Col 2: GPS Distance -->
<div class="flex flex-col items-center justify-center text-center px-1">
<span class="font-headline-h2 text-[26px] leading-8 font-bold text-text-primary tracking-tight font-display-stat tabular-nums">38.6</span>
<span class="font-caption-timestamp text-caption-timestamp text-text-secondary mt-0.5">km</span>
</div>
<!-- Col 3: Recorded Farm Visits -->
<div class="flex flex-col items-center justify-center text-center px-1">
<span class="font-headline-h2 text-[26px] leading-8 font-bold text-text-primary tracking-tight font-display-stat tabular-nums">3</span>
<span class="font-caption-timestamp text-caption-timestamp text-text-secondary mt-0.5">Visits</span>
</div>
</div>
<!-- Primary Field Action CTA Button -->
<button class="w-full h-12 bg-brand-primary active:bg-brand-pressed text-white rounded-xl flex items-center justify-center gap-2 shadow-sm transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-label-medium text-label-medium font-medium tracking-wide">Add visit</span>
</button>
</section>
<!-- Client Micro-Interactions Script -->
<script>
    const recenterBtn = document.getElementById('recenterBtn');
    if (recenterBtn) {
      recenterBtn.addEventListener('click', () => {
        recenterBtn.classList.add('bg-brand-tint');
        setTimeout(() => recenterBtn.classList.remove('bg-brand-tint'), 300);
      });
    }
  </script>
</div></main></body></html>
