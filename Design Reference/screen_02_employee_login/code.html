<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

status-on-duty-bg": "#DCFCE7", "primary": "#006194", "on-secondary-container": "#00587e", "surface-container-low": "#f2f3ff", "status-stale": "#F59E0B", "on-error-container": "#93000a", "primary-fixed-dim": "#93ccff", "brand-tint": "#E8F3F8", "status-suspect-bg": "#FEE2E2", "surface-card": "#FFFFFF", "inverse-surface": "#283044", "inverse-on-surface": "#eef0ff", "border-input": "#CBD5E1", "primary-fixed": "#cce5ff", "status-on-duty": "#16A34A", "surface-tint": "#006398", "status-info": "#0284C7", "on-secondary-fixed-variant": "#004c6d", "surface-variant": "#dae2fd", "secondary-fixed-dim": "#86cfff", "on-primary": "#ffffff", "error-container": "#ffdad6", "surface-bright": "#faf8ff", "text-secondary": "#64748B" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "32px", "margin": "16px", "space-xs": "4px", "space-block": "40px", "gutter": "16px", "space-md": "16px", "space-sm": "8px", "space-section": "48px", "space-2xs": "4px", "space-3xs": "8px", "space-base": "12px", "space-touch": "20px", "space-lg": "24px" }, "fontFamily": { "headline-h3": ["DM Sans"], "display-stat": ["DM Sans"], "body-default": ["DM Sans"], "caption-timestamp": ["DM Sans"], "headline-h2": ["DM Sans"], "overline-micro": ["DM Sans"], "label-medium": ["DM Sans"], "title-item": ["DM Sans"], "body-large": ["DM Sans"] }, "fontSize": { "headline-h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "display-stat": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-default": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "caption-timestamp": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-h2": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "overline-micro": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }], "label-medium": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "title-item": ["18px", { "lineHeight": </head><body class="bg-page-bg text-text-primary min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full h-full bg-page-bg"><div class="flex flex-col w-full relative min-h-[760px] pb-8">
<!-- Top Header Block (160px, rounded-b-[24px]) -->
<div class="w-full h-[160px] bg-brand-primary rounded-b-[24px] px-margin pt-6 flex flex-col justify-start relative z-0">
<div class="flex items-center gap-3">
<!-- Geometric Diamond Outline Vector Logo -->
<div class="w-10 h-10 flex items-center justify-center text-white shrink-0">
<svg class="w-10 h-10 stroke-white" fill="none" viewbox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
<polygon fill="none" points="20,4 36,16 20,36 4,16" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></polygon>
<line stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" x1="4" x2="36" y1="16" y2="16"></line>
<line stroke="currentColor" stroke-dasharray="2 2" stroke-opacity="0.7" stroke-width="1.5" x1="20" x2="20" y1="4" y2="36"></line>
</svg>
</div>
<div class="flex flex-col">
<h1 class="font-headline-h3 text-headline-h3 text-white tracking-tight leading-tight">
          Diamond Agritech
        </h1>
<p class="font-body-default text-body-default text-white/80 leading-normal">
          Employee Login
        </p>
</div>
</div>
</div>
<!-- Overlapping Login Card (-24px overlap, 16px horizontal margins) -->
<div class="mx-margin -mt-6 relative z-10 bg-surface-card rounded-[16px] border border-border-divider p-5 flex flex-col">
<!-- Field 1: Employee ID -->
<div class="flex flex-col">
<label class="font-label-medium text-label-medium text-text-secondary mb-1.5" for="employee-id">
        Employee ID
      </label>
<div class="h-12 rounded-xl border border-border-input bg-surface-card flex items-center px-3 transition-colors focus-within:border-brand-primary">
<span class="material-symbols-outlined text-text-disabled text-[20px] select-none mr-2">
          badge
        </span>
<input autocomplete="username" class="w-full font-body-large text-body-large text-text-primary bg-transparent outline-none tracking-normal" id="employee-id" type="text" value="DA-014"/>
</div>
</div>
<!-- Field 2: PIN (16px gap) -->
<div class="flex flex-col mt-4">
<label class="font-label-medium text-label-medium text-text-secondary mb-1.5" for="pin-field">
        PIN
      </label>
<div class="h-12 rounded-xl border border-border-input bg-surface-card flex items-center justify-between px-3 transition-colors focus-within:border-brand-primary">
<div class="flex items-center flex-1 mr-2 overflow-hidden">
<input autocomplete="current-password" class="w-full font-body-large text-body-large text-text-primary bg-transparent outline-none tracking-widest text-lg font-mono" id="pin-field" type="password" value="123456"/>
</div>
<button aria-label="Toggle PIN visibility" class="text-text-disabled hover:text-text-secondary flex items-center justify-center p-1" id="toggle-pin-btn" type="button">
<span class="material-symbols-outlined text-[20px] select-none" id="eye-icon">
            visibility
          </span>
</button>
</div>
<!-- Info / Error Strip (Directly beneath PIN) -->
<div class="mt-2 bg-status-suspect-bg text-status-suspect rounded-[8px] px-3 py-2 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] shrink-0" style="font-variation-settings: 'FILL' 1;">
          error
        </span>
<span class="font-caption-timestamp text-caption-timestamp leading-tight">
          Incorrect PIN. 3 attempts remaining.
        </span>
</div>
<!-- Right-aligned Forgot PIN Link (8px gap) -->
<div class="mt-2 flex justify-end">
<button class="font-label-medium text-label-medium text-brand-primary hover:text-brand-pressed focus:outline-none" type="button">
          Forgot PIN?
        </button>
</div>
</div>
<!-- Primary Action Button (24px gap) -->
<button class="mt-6 w-full h-12 bg-brand-primary hover:bg-brand-pressed active:bg-brand-pressed rounded-xl font-label-medium text-label-medium text-white flex items-center justify-center transition-colors shadow-none select-none" id="login-btn" type="button">
      Log in
    </button>
</div>
<!-- Below Card: Helper Text -->
<div class="mt-6 text-center px-margin">
<p class="font-caption-timestamp text-caption-timestamp text-text-secondary">
      Contact the office if you cannot sign in.
    </p>
</div>
<!-- Spacer to pin bottom element reliably on mobile -->
<div class="flex-1 min-h-[48px]"></div>
<!-- Bottom Admin Login Utility -->
<div class="w-full flex justify-center pb-2">
<button class="h-10 px-4 flex items-center justify-center font-label-medium text-label-medium text-brand-primary hover:text-brand-pressed focus:outline-none" type="button">
      Admin login
    </button>
</div>
</div>
<script>
  (function() {
    const pinInput = document.getElementById('pin-field');
    const toggleBtn = document.getElementById('toggle-pin-btn');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pinInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pinInput.getAttribute('type') === 'password';
        if (isPassword) {
          pinInput.setAttribute('type', 'text');
          eyeIcon.textContent = 'visibility_off';
        } else {
          pinInput.setAttribute('type', 'password');
          eyeIcon.textContent = 'visibility';
        }
      });
    }

    const loginBtn = document.getElementById('login-btn');
    if (loginBtn) {
      loginBtn.addEventListener('click', function() {
        this.classList.add('opacity-90');
        setTimeout(() => {
          this.classList.remove('opacity-90');
        }, 150);
      });
    }
  })();
</script></main></body></html>
