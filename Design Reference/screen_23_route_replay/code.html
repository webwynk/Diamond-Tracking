<script>
  // Simple micro-interaction for playback pause/play state toggle
  document.getElementById('playbackToggleBtn')?.addEventListener('click', function() {
    const icon = document.getElementById('playbackIcon');
    if (icon) {
      if (icon.textContent === 'pause') {
        icon.textContent = 'play_arrow';
      } else {
        icon.textContent = 'pause';
      }
    }
  });
</script></main></body></html>
