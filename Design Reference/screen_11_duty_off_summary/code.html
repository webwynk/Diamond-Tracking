portant;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-page-bg text-text-primary font-body-default antialiased relative min-h-screen"><div aria-hidden="true" class="fixed inset-0 pointer-events-none select-none overflow-hidden bg-page-bg opacity-35"><div class="h-14 bg-brand-primary flex items-center justify-between px-margin"><div class="h-6 w-32 bg-surface/20"></div><div class="w-8 h-8 rounded-full bg-surface/20"></div></div><div class="p-margin flex flex-col gap-space-md"><div class="h-20 bg-surface-card border-b border-border-divider"></div><div class="h-28 bg-surface-card border-b border-border-divider"></div><div class="h-36 bg-surface-card border-b border-border-divider"></div></div></div><div class="fixed inset-0 z-40 bg-text-primary/50 backdrop-blur-[2px]"></div><main class="relative z-50 flex min-h-screen w-full flex-col items-center justify-center px-margin pt-safe pb-safe"><div class="w-full max-w-[358px] bg-surface-card shadow-[0_1px_8px_rgba(0,0,0,0.08)] flex flex-col"><div class="flex flex-col w-full">

<div class="relative flex items-center justify-center mb-space-base">
<div class="absolute w-[88px] h-[88px] rounded-full bg-status-on-duty-bg/60 animate-ping opacity-25"></div>
<div class="w-[72px] h-[72px] rounded-full bg-status-on-duty-bg flex items-center justify-center relative z-10 shadow-sm transition-transform active:scale-95">
<span class="material-symbols-outlined text-[36px] text-status-on-duty select-none" style="font-variation-settings: 'FILL' 1, 'wght' 600;">
          check_circle
        </span>
</div>
</div>
<!-- Header & Shift Interval -->
<h2 class="font-headline-h2 text-headline-h2 text-text-primary text-center tracking-tight mb-space-2xs">
      Duty ended
    </h2>
<p class="font-body-default text-body-default text-text-secondary text-center">
      12 Oct 2026 · 8:04 AM to 4:28 PM
    </p>
<!-- Warm Completion Note -->
<div class="mt-space-2xs mb-space-lg px-space-base py-space-xs rounded-full bg-brand-tint flex items-center gap-space-2xs">
<span class="material-symbols-outlined text-[15px] text-brand-primary">sentiment_satisfied</span>
<span class="font-overline-micro text-overline-micro uppercase tracking-wider text-brand-primary">Shift Complete · Rest Well</span>
</div>
<!-- Shift Telemetry Metrics Panel -->
<div class="w-full bg-page-bg rounded-[12px] p-space-md shadow-inner flex flex-col gap-space-base">
<!-- Metric Row 1: Duration -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-7 h-7 rounded-lg bg-surface-card flex items-center justify-center shadow-xs">
<span class="material-symbols-outlined text-[18px] text-text-secondary select-none">
              schedule
            </span>
</div>
<span class="font-body-default text-body-default text-text-secondary truncate">
            Total hours
          </span>
</div>
<span class="font-title-item text-title-item text-text-primary tabular-nums tracking-tight font-semibold">
          8h 24m
        </span>
</div>
<!-- Divider line via pure tone shift -->
<div class="w-full h-[1px] bg-border-divider"></div>
<!-- Metric Row 2: Distance Logged -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-7 h-7 rounded-lg bg-surface-card flex items-center justify-center shadow-xs">
<span class="material-symbols-outlined text-[18px] text-text-secondary select-none">
              alt_route
            </span>
</div>
<span class="font-body-default text-body-default text-text-secondary truncate">
            Distance
          </span>
</div>
<span class="font-title-item text-title-item text-text-primary tabular-nums tracking-tight font-semibold">
          52.1 km
        </span>
</div>
<!-- Divider line via pure tone shift -->
<div class="w-full h-[1px] bg-border-divider"></div>
<!-- Metric Row 3: Farm Visits -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-7 h-7 rounded-lg bg-surface-card flex items-center justify-center shadow-xs">
<span class="material-symbols-outlined text-[18px] text-text-secondary select-none">
              pin_drop
            </span>
</div>
<span class="font-body-default text-body-default text-text-secondary truncate">
            Visits
          </span>
</div>
<span class="font-title-item text-title-item text-text-primary tabular-nums tracking-tight font-semibold">
          6
        </span>
</div>
</div>
<!-- Cloud Sync Status Indicator -->
<div class="mt-space-sm flex items-center justify-center gap-space-2xs text-text-disabled">
<span class="material-symbols-outlined text-[14px] text-status-on-duty select-none" style="font-variation-settings: 'FILL' 1;">
        check
      </span>
<span class="font-caption-timestamp text-caption-timestamp">
        All data synced
      </span>
</div>
<!-- Primary Actions Group -->
<div class="w-full flex flex-col gap-space-2xs mt-space-lg">

<button class="w-full h-12 rounded-[12px] bg-brand-primary active:bg-brand-pressed text-surface-card font-label-medium text-label-medium transition-all shadow-md active:scale-[0.98] flex items-center justify-center gap-space-sm select-none" id="btn-done" type="button">
<span>Done</span>
</button>
<!-- Secondary Route Review Action -->
<button class="w-full h-12 rounded-[12px] bg-transparent active:bg-brand-tint text-brand-primary font-label-medium text-label-medium transition-colors flex items-center justify-center gap-space-xs select-none" id="btn-view-route" type="button">
<span class="material-symbols-outlined text-[18px]">map</span>
<span>View today's route</span>
</button>
</div>
</div>
</div>
<script>
  (function() {
    const doneBtn = document.getElementById('btn-done');
    const viewRouteBtn = document.getElementById('btn-view-route');

    if (doneBtn) {
      doneBtn.addEventListener('click', function() {
        this.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Closing shift...</span>';
        setTimeout(() => {
          this.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span><span>Closed</span>';
        }, 600);
      });
    }

    if (viewRouteBtn) {
      viewRouteBtn.addEventListener('click', function() {
        this.classList.add('bg-brand-tint');
      });
    }
  })();
</script></div></main></body></html>
