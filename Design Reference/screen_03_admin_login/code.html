</head><body class="bg-page-bg text-text-primary min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full h-full bg-page-bg"><div class="flex flex-col w-full">
<!-- Top Teal-Blue Header Container -->
<div class="w-full bg-brand-primary h-[140px] px-gutter pt-space-lg flex flex-col justify-start rounded-b-[24px]">
<div class="flex items-center gap-space-base">
<!-- Geometric Diamond Logo Mark (36px) -->
<div class="w-[36px] h-[36px] flex items-center justify-center shrink-0 text-on-primary">
<svg aria-label="Diamond Agritech Logo" fill="none" height="36" viewbox="0 0 36 36" width="36" xmlns="http://www.w3.org/2000/svg">
<path d="M18 2L34 18L18 34L2 18L18 2Z" stroke="#FFFFFF" stroke-linejoin="miter" stroke-width="2.5"></path>
<path d="M18 9L27 18L18 27L9 18L18 9Z" stroke="#FFFFFF" stroke-dasharray="2 2" stroke-width="1.5"></path>
<circle cx="18" cy="18" fill="#FFFFFF" r="2.5"></circle>
</svg>
</div>
<!-- Header Wordmark / Screen Title -->
<h1 class="font-headline-h3 text-headline-h3 text-on-primary tracking-tight">Admin Login</h1>
</div>
<div class="mt-space-xs pl-[48px]">
<p class="font-overline-micro text-overline-micro text-secondary-fixed opacity-90 uppercase tracking-widest">Enterprise Telemetry System</p>
</div>
</div>
<!-- Main Overlapping Card Container -->
<div class="px-gutter -mt-[24px] w-full">
<div class="w-full bg-surface-card rounded-[16px] border border-border-divider p-space-touch">
<form class="flex flex-col" id="adminLoginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Field 1: Email -->
<div class="flex flex-col">
<label class="font-label-medium text-label-medium text-text-secondary mb-space-xs" for="adminEmail">
            Email
          </label>
<div class="relative w-full h-[48px] bg-surface-card rounded-[12px] border border-border-input flex items-center px-space-base focus-within:border-brand-primary transition-colors">
<!-- Mail Icon (SVG 20px in #94A3B8) -->
<span class="w-[20px] h-[20px] flex items-center justify-center text-status-off-duty shrink-0 mr-space-base">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20">
<rect height="16" rx="2" width="20" x="2" y="4"></rect>
<path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
</svg>
</span>
<input autocomplete="email" class="w-full bg-transparent font-body-large text-body-large text-text-primary focus:outline-none placeholder-text-disabled" id="adminEmail" name="email" placeholder="name@diamondagritech.in" required="" type="email" value="office@diamondagritech.in"/>
</div>
</div>
<!-- 16px Vertical Gap -->
<div class="h-space-md"></div>
<!-- Field 2: Password -->
<div class="flex flex-col">
<label class="font-label-medium text-label-medium text-text-secondary mb-space-xs" for="adminPassword">
            Password
          </label>
<div class="relative w-full h-[48px] bg-surface-card rounded-[12px] border border-border-input flex items-center px-space-base focus-within:border-brand-primary transition-colors">
<input autocomplete="current-password" class="w-full bg-transparent font-body-large text-body-large text-text-primary focus:outline-none tracking-widest" id="adminPassword" name="password" placeholder="Enter password" required="" type="password" value="••••••••"/>
<!-- Eye Reveal Toggle Button (SVG 20px in #94A3B8) -->
<button aria-label="Toggle password visibility" class="w-[48px] h-[48px] -mr-space-base flex items-center justify-center text-status-off-duty hover:text-brand-primary active:text-brand-pressed transition-colors focus:outline-none" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<svg fill="none" height="20" id="eyeIcon" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20">
<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
</div>
<!-- 16px Vertical Gap -->
<div class="h-space-md"></div>
<!-- Options Row: Checkbox + Forgot Password Link -->
<div class="flex items-center justify-between min-h-[48px]">
<!-- Checkbox control with 48px touch wrapper -->
<label class="flex items-center gap-space-sm cursor-pointer select-none py-space-sm group">
<input checked="" class="sr-only peer" id="rememberMe" type="checkbox"/>
<div class="w-[20px] h-[20px] rounded-[4px] border border-brand-primary bg-surface-card flex items-center justify-center peer-checked:bg-brand-primary peer-checked:border-brand-primary transition-colors">
<svg class="w-[12px] h-[12px] text-on-primary fill-current" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</div>
<span class="font-body-default text-body-default text-on-surface-variant group-hover:text-text-primary transition-colors">
              Keep me signed in
            </span>
</label>
<!-- Forgot Password Link -->
<a class="min-h-[48px] inline-flex items-center font-label-medium text-label-medium text-brand-primary hover:text-brand-pressed active:text-brand-pressed focus:outline-none transition-colors" href="#forgot-password">
            Forgot password?
          </a>
</div>
<!-- 24px Vertical Gap -->
<div class="h-space-lg"></div>
<!-- Primary CTA Button -->
<button class="w-full h-[48px] bg-brand-primary hover:bg-brand-pressed active:bg-brand-pressed rounded-[12px] flex items-center justify-center transition-colors focus:outline-none" id="loginSubmitBtn" type="submit">
<span class="font-label-medium text-label-medium text-on-primary tracking-wide">
            Log in
          </span>
</button>
</form>
</div>
</div>
<!-- Agritech Context Badge / Micro-telemetry Status (Playful Brand Touch) -->
<div class="px-gutter mt-space-lg flex items-center justify-center">
<div class="inline-flex items-center gap-space-sm px-space-base py-space-2xs bg-surface-card border border-border-divider rounded-full">
<span class="w-[8px] h-[8px] rounded-full bg-status-on-duty animate-pulse"></span>
<span class="font-overline-micro text-overline-micro text-text-secondary uppercase">
        Central Node: Pune Server AP-01 Active
      </span>
</div>
</div>
<!-- Generous Space & Anchored Bottom Section -->
<div class="flex-1 min-h-[140px] flex flex-col justify-end items-center pb-space-lg px-gutter">
<div class="w-full flex flex-col items-center">
<!-- Employee Login Alternative Link (min 48px touch target) -->
<a class="min-h-[48px] px-space-lg inline-flex items-center justify-center font-label-medium text-label-medium text-brand-primary hover:text-brand-pressed active:text-brand-pressed transition-colors" href="#employee-login">
<span class="flex items-center gap-space-xs">
<span>Employee login</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</span>
</a>
<!-- Agritech System Security Microcopy -->
<p class="font-caption-timestamp text-caption-timestamp text-text-secondary mt-space-2xs text-center">
        Diamond Agritech Portal • Encrypted GPS Audit Trail v4.8
      </p>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('adminPassword');
    const eyeIcon = document.getElementById('eyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      if (passwordInput.value === '••••••••') {
        passwordInput.value = 'FieldAgritech2026';
      }
      eyeIcon.innerHTML = `
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
        <line x1="2" y1="2" x2="22" y2="22"></line>
      `;
    } else {
      passwordInput.type = 'password';
      eyeIcon.innerHTML = `
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      `;
    }
  }

  function handleLogin() {
    const btn = document.getElementById('loginSubmitBtn');
    if (!btn) return;
    const originalText = btn.innerHTML;
    btn.innerHTML = `
      <span class="flex items-center gap-space-xs font-label-medium text-label-medium text-on-primary">
        <span class="w-[14px] h-[14px] border-2 border-on-primary border-t-transparent rounded-full animate-spin"></span>
        <span>Authenticating...</span>
      </span>
    `;
    btn.disabled = true;

    setTimeout(() => {
      btn.innerHTML = `
        <span class="flex items-center gap-space-xs font-label-medium text-label-medium text-on-primary">
          <span class="material-symbols-outlined text-[18px]">check_circle</span>
          <span>Access Verified</span>
        </span>
      `;
      btn.classList.remove('bg-brand-primary');
      btn.classList.add('bg-status-on-duty');
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.classList.remove('bg-status-on-duty');
        btn.classList.add('bg-brand-primary');
        btn.disabled = false;
      }, 1600);
    }, 900);
  }
</script></main></body></html>
